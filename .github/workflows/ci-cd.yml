name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. The deploy job widens this for itself.
permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  # Superseded PR runs are worth cancelling; an in-flight deploy is not — it
  # would leave the box half-updated. Pushes to main queue up instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Both tools are installed from their upstream prebuilt binaries rather than
# `go install`, which compiles them from source on every run (sqlc especially —
# it vendors a full PostgreSQL parser and a WASM runtime). Their dependencies
# are not in this repo's go.sum, so setup-go's cache does not help them.
#
# `go install` verifies modules against GOSUMDB; a release download has no such
# check, so the SHA-256s below are mandatory, not decorative. To bump a version,
# change the pair here and nowhere else.
env:
  SQLC_VERSION: v1.31.1   # must match the version that generated the committed code
  SQLC_SHA256: 497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354
  GOOSE_VERSION: v3.27.3
  GOOSE_SHA256: ca18112e2438b3ad608af9a5938beafd01fa36a4a19a3edbe4f29226ca5c8533

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod   # tracks the `go 1.26.5` directive
          cache: true               # module + build cache, keyed off go.sum

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # The release asset drops the leading `v` that SQLC_VERSION carries.
      - name: Install sqlc
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/sqlc.tar.gz" \
            "https://github.com/sqlc-dev/sqlc/releases/download/${SQLC_VERSION}/sqlc_${SQLC_VERSION#v}_linux_amd64.tar.gz"
          echo "${SQLC_SHA256}  $RUNNER_TEMP/sqlc.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/sqlc.tar.gz" -C "$RUNNER_TEMP/bin" sqlc
          chmod +x "$RUNNER_TEMP/bin/sqlc"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # queries.sql.go and friends are committed, so they can drift from
      # queries.sql / the migrations. `sqlc diff` fails if regeneration is due.
      - name: sqlc up to date
        run: sqlc diff

  test:
    name: test
    runs-on: ubuntu-latest

    # A throwaway Postgres beside the job. The oversell guarantee lives in SQL
    # (ReserveStock's `quantity - num_reserved > 0`, CompleteOrder's
    # `status = 'pending'`), so a mocked repo.Querier cannot exercise it — the
    # concurrency test needs real row locking.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doorbust_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      # Set directly rather than through scripts/with-env.sh, which requires a
      # .env file that does not exist on a runner.
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://postgres:postgres@localhost:5432/doorbust_test?sslmode=disable
      GOOSE_MIGRATION_DIR: ./internal/adapters/postgresql/migrations
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/doorbust_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install goose
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/goose" \
            "https://github.com/pressly/goose/releases/download/${GOOSE_VERSION}/goose_linux_x86_64"
          echo "${GOOSE_SHA256}  $RUNNER_TEMP/bin/goose" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/goose"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Migrate test database
        run: goose up

      # -race matters here: the whole point of the suite is concurrent access.
      - name: go test
        run: go test -race ./...

  deploy:
    name: deploy
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Gates access to the NEON_DSN secret. The environment's deployment branch
    # policy allows only `main`, so a pull_request run — which CAN see plain
    # repository secrets — is refused before the job starts and never receives
    # the DSN. The `if:` above is convenience; this is the enforcement.
    environment: production

    permissions:
      contents: read
      id-token: write   # lets the job request the OIDC token AWS trades for creds

    env:
      IMAGE: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}

    steps:
      - uses: actions/checkout@v7

      # Deliberately before the credentials step: no reason to be fetching a
      # remote binary while this job is holding AWS credentials. This job needs
      # no Go toolchain at all — the Dockerfile compiles the app inside the
      # image — so there is no actions/setup-go here.
      - name: Install goose
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/goose" \
            "https://github.com/pressly/goose/releases/download/${GOOSE_VERSION}/goose_linux_x86_64"
          echo "${GOOSE_SHA256}  $RUNNER_TEMP/bin/goose" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/goose"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Assume AWS deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      # No --platform/QEMU needed: ubuntu-latest is x86_64, matching the
      # AL2023 AMI. (An arm64 image would exec format error on the instance.)
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs before the restart, so for a few seconds the old binary sees the
      # new schema. Keep migrations backward-compatible (expand-then-contract).
      - name: Migrate Neon
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: ${{ secrets.NEON_DSN }}
          GOOSE_MIGRATION_DIR: ./internal/adapters/postgresql/migrations
        run: goose up

      # Terraform state is local and gitignored, so `terraform output` is not
      # available here. Find the box by its tag instead.
      - name: Find the instance
        id: instance
        run: |
          id="$(aws ec2 describe-instances \
            --filters 'Name=tag:Name,Values=doorbust-benchmark' \
                      'Name=instance-state-name,Values=running' \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)"
          if [ -z "$id" ] || [ "$id" = "None" ]; then
            echo "::error::No running instance tagged doorbust-benchmark found."
            exit 1
          fi
          echo "Found $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM
        id: send
        run: |
          set -euo pipefail
          cat > /tmp/remote-deploy.sh <<EOF
          set -euo pipefail
          IMAGE="${IMAGE}"
          REGISTRY="\${IMAGE%%/*}"

          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "\$REGISTRY"

          docker pull "\$IMAGE"
          # doorbust.service runs the fixed local tag doorbust:latest, and that
          # unit file is inlined into user_data — editing it would force an
          # instance replacement. Retagging keeps the unit untouched.
          docker tag "\$IMAGE" doorbust:latest
          systemctl restart doorbust

          for i in \$(seq 1 15); do
            if curl -fsS localhost:8080/health; then
              echo "; health OK after \$i attempt(s)"
              break
            fi
            if [ "\$i" = 15 ]; then
              echo "health check never passed"
              journalctl -u doorbust -n 50 --no-pager
              exit 1
            fi
            sleep 2
          done

          docker image prune -af --filter "until=24h"
          EOF

          cid="$(aws ssm send-command \
            --instance-ids '${{ steps.instance.outputs.id }}' \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA:0:7}" \
            --parameters "$(jq -n --rawfile s /tmp/remote-deploy.sh '{commands: [$s]}')" \
            --query Command.CommandId --output text)"
          echo "Command $cid dispatched"
          echo "id=$cid" >> "$GITHUB_OUTPUT"

      # send-command returns as soon as the command is QUEUED. Without this the
      # job would go green on a deploy that crashed on the box.
      - name: Wait for the deploy to finish
        run: |
          set -euo pipefail
          cid='${{ steps.send.outputs.id }}'
          iid='${{ steps.instance.outputs.id }}'
          for _ in $(seq 1 60); do
            status="$(aws ssm get-command-invocation \
              --command-id "$cid" --instance-id "$iid" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$cid" --instance-id "$iid" \
            --query 'StandardOutputContent' --output text
          aws ssm get-command-invocation --command-id "$cid" --instance-id "$iid" \
            --query 'StandardErrorContent' --output text >&2

          echo "Final status: $status"
          [ "$status" = "Success" ]
